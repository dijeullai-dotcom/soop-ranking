name: Update Ranking Data

on:
  schedule:
    # 5분마다 실행 (GitHub Actions의 최소 주기)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          # 필요한 경우 pip install requests beautifulsoup4 등을 추가하세요.

      - name: 스크래퍼 실행 (data.html 업데이트)
        run: python scraper.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.html
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update ranking data [skip ci]" && git push)
