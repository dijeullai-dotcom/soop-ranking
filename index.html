<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOOP 실시간 랭킹 보드</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 사용자 지정 CSS 변수 */
        :root {
            --primary: #3b82f6; 
            --primary-light: #eff6ff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --card: #ffffff;
            --card-border: #e5e7eb;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --success: #10b981;
            --success-bg: #d1fae5;
            --divider: #f3f4f6;
            --gold: #fbbf24;
            --gold-bg: linear-gradient(135deg, #fde68a, #fbbf24);
            --silver: #9ca3af;
            --silver-bg: linear-gradient(135deg, #e5e7eb, #9ca3af);
            --bronze: #b45309;
            --bronze-bg: linear-gradient(135deg, #fcd34d, #b45309);
            --stats-gradient-comments: linear-gradient(to right, #3b82f6, #8b5cf6);
            --stats-gradient-top: linear-gradient(to right, #ec4899, #f43f5e);
            --stats-icon-bg-comments: #eff6ff;
            --stats-icon-color-comments: #3b82f6;
            --stats-icon-bg-top: #fdf2f8;
            --stats-icon-color-top: #ec4899;
        }
        body { 
            background-color: #f9fafb; 
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }
        .animate-pulse-live {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body>
    <!-- 데이터가 들어갈 컨테이너 -->
    <div id="app">
        <div class="flex h-screen items-center justify-center">
            <p class="text-lg font-bold text-gray-500 animate-pulse">데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <script>
        let pollingInterval = 10000; // 10초 기본값
        let timerId = null;

        async function fetchRankingData() {
            try {
                // 브라우저 캐싱을 막기 위해 현재 시간 파라미터 추가
                const response = await fetch(`data.html?t=${new Date().getTime()}`);
                
                if (response.ok) {
                    const htmlText = await response.text();
                    document.getElementById('app').innerHTML = htmlText;
                } else {
                    console.log("데이터를 불러오지 못했습니다. 아직 GitHub Actions가 실행되지 않았을 수 있습니다.");
                }
            } catch (error) {
                console.error("데이터 로드 실패:", error);
            }
        }

        // 초기 로드
        fetchRankingData();

        // 10초마다 갱신 (화면 깜빡임 없이 innerHTML 교체)
        timerId = setInterval(fetchRankingData, pollingInterval);
    </script>
</body>
</html>
